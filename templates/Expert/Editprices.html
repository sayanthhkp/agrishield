<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', Arial, sans-serif;
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #E8F5E9;
    }

    #form1 {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 550px;
        overflow: hidden;
    }

    table {
        width: 100% !important;
        height: auto !important;
        border: none !important;
        border-collapse: collapse;
    }

    tr, th, td {
        border: none !important;
    }

    /* Header Row */
    tr:first-child th {
        background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%) !important;
        padding: 40px 30px !important;
        text-align: center !important;
        color: #ffffff !important;
        font-size: 26px !important;
        font-weight: 700 !important;
    }

    /* Form Rows */
    tr:not(:first-child):not(:last-child) {
        background: #ffffff;
        border-bottom: 1px solid #E8F5E9 !important;
    }

    tr:not(:first-child):not(:last-child):hover {
        background: #F1F8E9;
    }

    /* Labels */
    th[scope="row"] {
        background: transparent !important;
        color: #1B5E20 !important;
        font-size: 15px !important;
        font-weight: 600 !important;
        text-align: left !important;
        padding: 22px 15px 22px 30px !important;
        width: 130px !important;
        vertical-align: middle !important;
    }

    /* Input Cells */
    td {
        padding: 18px 30px 18px 10px !important;
        vertical-align: middle !important;
    }

    td label {
        display: none !important;
    }

    /* Input Fields */
    input[type="text"] {
        width: 100% !important;
        padding: 14px 18px !important;
        font-size: 15px !important;
        font-weight: 500 !important;
        font-family: 'Inter', Arial, sans-serif !important;
        color: #1B5E20 !important;
        background: #FAFAFA !important;
        border: 2px solid #C8E6C9 !important;
        border-radius: 10px !important;
        outline: none !important;
        transition: all 0.3s ease !important;
    }

    input[type="text"]::placeholder {
        color: #81C784 !important;
        font-weight: 400 !important;
    }

    input[type="text"]:focus {
        border-color: #4CAF50 !important;
        background: #ffffff !important;
        box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.15) !important;
    }

    /* Price Input - Special Style */
    .price-input-wrapper {
        position: relative;
    }

    .price-input-wrapper input {
        padding-left: 35px !important;
    }

    .currency-symbol {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #43A047;
        font-weight: 600;
        font-size: 16px;
    }

    /* Submit Button Row */
    tr:last-child th {
        background: #F5F5F5 !important;
        padding: 30px !important;
        text-align: center !important;
        border-top: 2px solid #E8F5E9 !important;
    }

    /* Submit Button */
    input[type="submit"],
    input#button {
        background: linear-gradient(135deg, #43A047 0%, #2E7D32 100%) !important;
        color: #ffffff !important;
        border: none !important;
        padding: 16px 50px !important;
        font-size: 16px !important;
        font-weight: 700 !important;
        font-family: 'Inter', Arial, sans-serif !important;
        border-radius: 12px !important;
        cursor: pointer !important;
        text-transform: uppercase !important;
        letter-spacing: 1.5px !important;
        box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3) !important;
        transition: all 0.3s ease !important;
    }

    input[type="submit"]:hover,
    input#button:hover {
        background: linear-gradient(135deg, #388E3C 0%, #1B5E20 100%) !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4) !important;
    }

    /* Filled Input Indicator */
    .input-filled {
        border-color: #4CAF50 !important;
        background: #F1F8E9 !important;
    }

    /* Responsive */
    @media (max-width: 600px) {
        body {
            padding: 20px 15px;
        }

        #form1 {
            border-radius: 15px;
        }

        tr:first-child th {
            padding: 30px 20px !important;
            font-size: 22px !important;
        }

        th[scope="row"] {
            display: block !important;
            width: 100% !important;
            padding: 18px 20px 8px 20px !important;
            text-align: left !important;
        }

        td {
            display: block !important;
            padding: 0 20px 18px 20px !important;
        }

        input[type="submit"],
        input#button {
            width: 100% !important;
            padding: 16px 40px !important;
        }
    }
</style>
</head>

<body>
<form id="form1" name="form1" method="post" action="/exp_edit_price_post/{{ id }}">
  <table width="816" height="217" border="1">
    <tr>
      <th colspan="2" scope="row">Edit Prices</th>
    </tr>
    <tr>
      <th scope="row">Item</th>
      <td><label for="textarea"></label>
        <label for="textfield"></label>
      <input type="text" name="textfield" id="textfield" value="{{ data.crops}}"/></td>
    </tr>
    <tr>
      <th scope="row">Price</th>
      <td><label for="textfield2"></label>
      <input type="text" name="textfield2" id="textfield2" value="{{ data.prices }}" /></td>
    </tr>
    <tr>
      <th colspan="2" scope="row"><input type="submit" name="button" id="button" value="Edit" /></th>
    </tr>
  </table>
</form>

<script>
(function() {
    // Add icon to header
    var header = document.querySelector('tr:first-child th');
    if (header) {
        header.innerHTML = '<i class="fas fa-tags" style="margin-right: 12px;"></i>' + header.innerHTML;
    }

    // Add icons to labels
    var labelIcons = {
        'Item': 'fa-seedling',
        'Price': 'fa-indian-rupee-sign'
    };

    var labels = document.querySelectorAll('th[scope="row"]');
    labels.forEach(function(label) {
        var text = label.textContent.trim();
        var icon = labelIcons[text];
        if (icon) {
            label.innerHTML = '<i class="fas ' + icon + '" style="margin-right: 10px; color: #43A047;"></i>' + text;
        }
    });

    // Style Item input
    var itemInput = document.getElementById('textfield');
    if (itemInput) {
        if (!itemInput.value || itemInput.value.indexOf('{{') !== -1) {
            itemInput.placeholder = 'Enter crop/item name';
        } else {
            itemInput.classList.add('input-filled');
        }
    }

    // Style Price input with currency symbol
    var priceInput = document.getElementById('textfield2');
    if (priceInput) {
        // Create wrapper
        var wrapper = document.createElement('div');
        wrapper.className = 'price-input-wrapper';
        priceInput.parentNode.insertBefore(wrapper, priceInput);
        wrapper.appendChild(priceInput);

        // Add currency symbol
        var currencySymbol = document.createElement('span');
        currencySymbol.className = 'currency-symbol';
        currencySymbol.innerHTML = '₹';
        wrapper.insertBefore(currencySymbol, priceInput);

        // Add placeholder if empty
        if (!priceInput.value || priceInput.value.indexOf('{{') !== -1) {
            priceInput.placeholder = 'Enter price per unit';
        } else {
            priceInput.classList.add('input-filled');
        }

        // Format price on blur
        priceInput.addEventListener('blur', function() {
            var value = priceInput.value.replace(/[^0-9.]/g, '');
            if (value && !isNaN(value)) {
                priceInput.value = parseFloat(value).toFixed(2);
            }
        });
    }

    // Update submit button text
    var submitBtn = document.getElementById('button');
    if (submitBtn) {
        submitBtn.value = 'Update Price';
    }

})();
</script>

</body>
</html>
