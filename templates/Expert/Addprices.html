<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Add Prices</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 50%, #A5D6A7 100%);
        padding: 40px 20px;
    }

    /* Form Container */
    #form1 {
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        padding: 0;
        width: 100%;
        max-width: 550px;
        overflow: hidden;
        position: relative;
        transition: all 0.3s ease;
    }

    #form1:hover {
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
        transform: translateY(-5px);
    }

    /* Decorative Elements */
    #form1::before {
        content: '';
        position: absolute;
        top: -50px;
        right: -50px;
        width: 150px;
        height: 150px;
        background: linear-gradient(135deg, rgba(76, 175, 80, 0.1) 0%, rgba(46, 125, 50, 0.05) 100%);
        border-radius: 50%;
        pointer-events: none;
    }

    /* Table Styles */
    table {
        width: 100% !important;
        height: auto !important;
        border: none !important;
        border-collapse: collapse;
    }

    tr, th, td {
        border: none !important;
    }

    /* Header Row */
    tr:first-child th {
        background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%) !important;
        padding: 45px 35px !important;
        text-align: center !important;
        color: #ffffff !important;
        font-size: 28px !important;
        font-weight: 800 !important;
        position: relative;
        overflow: hidden;
    }

    tr:first-child th::before {
        content: '';
        position: absolute;
        top: -30px;
        right: -30px;
        width: 100px;
        height: 100px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
    }

    tr:first-child th::after {
        content: '';
        position: absolute;
        bottom: -40px;
        left: -40px;
        width: 120px;
        height: 120px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 50%;
    }

    /* Content Rows */
    tr:not(:first-child):not(:last-child) {
        background: #ffffff;
        transition: all 0.3s ease;
    }

    tr:not(:first-child):not(:last-child):hover {
        background: linear-gradient(135deg, #F1F8E9 0%, #E8F5E9 100%);
    }

    /* Label Cells */
    th[scope="row"] {
        background: transparent !important;
        color: #1B5E20 !important;
        font-size: 15px !important;
        font-weight: 700 !important;
        text-align: left !important;
        padding: 30px 20px 30px 40px !important;
        width: 140px !important;
        vertical-align: middle !important;
    }

    /* Input Cells */
    td {
        padding: 25px 40px 25px 15px !important;
        vertical-align: middle !important;
    }

    td label {
        display: none !important;
    }

    /* Input Fields */
    input[type="text"] {
        width: 100% !important;
        padding: 16px 20px !important;
        font-size: 15px !important;
        font-weight: 500 !important;
        font-family: 'Inter', Arial, sans-serif !important;
        color: #1B5E20 !important;
        background: #FAFAFA !important;
        border: 2px solid #C8E6C9 !important;
        border-radius: 12px !important;
        outline: none !important;
        transition: all 0.3s ease !important;
    }

    input[type="text"]::placeholder {
        color: #81C784 !important;
        font-weight: 400 !important;
    }

    input[type="text"]:focus {
        border-color: #4CAF50 !important;
        background: #ffffff !important;
        box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.15) !important;
    }

    input[type="text"]:hover {
        border-color: #81C784 !important;
    }

    /* Footer Row */
    tr:last-child th {
        background: linear-gradient(135deg, #FAFAFA 0%, #F5F5F5 100%) !important;
        padding: 35px !important;
        text-align: center !important;
        border-top: 2px solid #E8F5E9 !important;
    }

    /* Submit Button */
    input[type="submit"],
    input#button {
        background: linear-gradient(135deg, #43A047 0%, #2E7D32 100%) !important;
        color: #ffffff !important;
        border: none !important;
        padding: 18px 60px !important;
        font-size: 16px !important;
        font-weight: 700 !important;
        font-family: 'Inter', Arial, sans-serif !important;
        border-radius: 14px !important;
        cursor: pointer !important;
        text-transform: uppercase !important;
        letter-spacing: 2px !important;
        box-shadow: 0 6px 25px rgba(46, 125, 50, 0.35) !important;
        transition: all 0.3s ease !important;
        position: relative;
        overflow: hidden;
    }

    input[type="submit"]:hover,
    input#button:hover {
        background: linear-gradient(135deg, #388E3C 0%, #1B5E20 100%) !important;
        transform: translateY(-3px) !important;
        box-shadow: 0 10px 35px rgba(46, 125, 50, 0.45) !important;
    }

    input[type="submit"]:active,
    input#button:active {
        transform: translateY(-1px) !important;
    }

    /* Loading State */
    .btn-loading {
        pointer-events: none !important;
        opacity: 0.7 !important;
    }

    /* Input Wrapper Enhancements */
    .input-wrapper {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #81C784;
        font-size: 18px;
        transition: color 0.3s ease;
    }

    .input-wrapper input {
        padding-left: 50px !important;
    }

    .input-wrapper input:focus + .input-icon,
    .input-wrapper:hover .input-icon {
        color: #4CAF50;
    }

    /* Price Input Prefix */
    .price-wrapper {
        position: relative;
    }

    .price-prefix {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #2E7D32;
        font-size: 18px;
        font-weight: 700;
    }

    .price-wrapper input {
        padding-left: 45px !important;
    }

    /* Validation Styles */
    .input-valid {
        border-color: #4CAF50 !important;
    }

    .input-invalid {
        border-color: #F44336 !important;
        animation: shake 0.5s ease;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-5px); }
        40%, 80% { transform: translateX(5px); }
    }

    /* Success Toast */
    .toast {
        position: fixed;
        top: 30px;
        right: 30px;
        padding: 22px 30px;
        border-radius: 16px;
        color: white;
        display: flex;
        align-items: center;
        gap: 18px;
        transform: translateX(150%);
        transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        z-index: 10000;
        box-shadow: 0 15px 50px rgba(0,0,0,0.25);
    }

    .toast.show {
        transform: translateX(0);
    }

    .toast.success {
        background: linear-gradient(135deg, #43A047 0%, #2E7D32 100%);
    }

    .toast.error {
        background: linear-gradient(135deg, #EF5350 0%, #E53935 100%);
    }

    .toast-icon {
        width: 50px;
        height: 50px;
        background: rgba(255,255,255,0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
    }

    .toast-text h4 {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 4px;
    }

    .toast-text p {
        font-size: 14px;
        opacity: 0.9;
    }

    /* Helper Text */
    .helper-text {
        font-size: 12px;
        color: #81C784;
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .helper-text i {
        font-size: 11px;
    }

    /* Quick Price Buttons */
    .quick-prices {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
    }

    .quick-price-btn {
        padding: 8px 16px;
        background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
        border: none;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        color: #2E7D32;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: 'Inter', sans-serif;
    }

    .quick-price-btn:hover {
        background: linear-gradient(135deg, #C8E6C9 0%, #A5D6A7 100%);
        transform: translateY(-2px);
    }

    /* Recent Prices */
    .recent-prices {
        margin-top: 15px;
        padding: 15px;
        background: linear-gradient(135deg, #FFF8E1 0%, #FFECB3 100%);
        border-radius: 10px;
        display: none;
    }

    .recent-prices.show {
        display: block;
    }

    .recent-prices-header {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #F57C00;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 10px;
    }

    .recent-item {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px dashed #FFE082;
        font-size: 13px;
        color: #795548;
    }

    .recent-item:last-child {
        border-bottom: none;
    }

    /* Responsive */
    @media (max-width: 600px) {
        body {
            padding: 20px 15px;
        }

        #form1 {
            border-radius: 20px;
        }

        tr:first-child th {
            font-size: 22px !important;
            padding: 35px 25px !important;
        }

        th[scope="row"] {
            display: block !important;
            width: 100% !important;
            padding: 25px 25px 10px 25px !important;
            text-align: center !important;
        }

        td {
            display: block !important;
            padding: 0 25px 25px 25px !important;
        }

        input[type="submit"] {
            width: 100% !important;
            padding: 18px 30px !important;
        }

        .toast {
            left: 15px;
            right: 15px;
        }

        .quick-prices {
            justify-content: center;
        }
    }
</style>
</head>

<body>

<!-- Toast Notification -->
<div class="toast success" id="toast">
    <div class="toast-icon">
        <i class="fas fa-check"></i>
    </div>
    <div class="toast-text">
        <h4>Success!</h4>
        <p>Price added successfully</p>

<!-- ORIGINAL CODE - UNCHANGED -->
<form id="form1" name="form1" method="post" action="/exp_add_price_post">
  <table width="816" height="217" border="1">
    <tr>
      <th colspan="2" scope="row">Add Prices</th>
    </tr>
    <tr>
      <th scope="row">Item</th>
      <td><label for="textarea"></label>
        <label for="textfield"></label>
      <input type="text" name="textfield" id="textfield" /></td>
    </tr>
    <tr>
      <th scope="row">Price</th>
      <td><label for="textfield2"></label>
      <input type="text" name="textfield2" id="textfield2" /></td>
    </tr>
    <tr>
      <th colspan="2" scope="row"><input type="submit" name="button" id="button" value="Add" /></th>
    </tr>
  </table>
</form>
<!-- ORIGINAL CODE ENDS -->

<script>
(function() {
    'use strict';

    // DOM Elements
    var form = document.getElementById('form1');
    var itemInput = document.getElementById('textfield');
    var priceInput = document.getElementById('textfield2');
    var submitBtn = document.getElementById('button');
    var toast = document.getElementById('toast');

    // Initialize
    function init() {
        enhanceForm();
        bindEvents();
    }

    // Enhance Form Elements
    function enhanceForm() {
        // Enhance Header
        var header = document.querySelector('tr:first-child th');
        if (header) {
            header.innerHTML = '<i class="fas fa-tags" style="margin-right: 15px;"></i>Add Prices';
        }

        // Enhance Item Label
        var itemLabel = document.querySelector('tr:nth-child(2) th[scope="row"]');
        if (itemLabel) {
            itemLabel.innerHTML = '<i class="fas fa-box" style="margin-right: 10px; color: #43A047;"></i>Item';
        }

        // Enhance Price Label
        var priceLabel = document.querySelector('tr:nth-child(3) th[scope="row"]');
        if (priceLabel) {
            priceLabel.innerHTML = '<i class="fas fa-rupee-sign" style="margin-right: 10px; color: #43A047;"></i>Price';
        }

        // Enhance Item Input
        if (itemInput) {
            itemInput.setAttribute('placeholder', 'Enter item name (e.g., Rice, Wheat)');

            // Wrap input
            var itemTd = itemInput.parentNode;
            var itemWrapper = document.createElement('div');
            itemWrapper.className = 'input-wrapper';
            itemInput.parentNode.insertBefore(itemWrapper, itemInput);
            itemWrapper.appendChild(itemInput);

            // Add icon
            var itemIcon = document.createElement('i');
            itemIcon.className = 'fas fa-cube input-icon';
            itemWrapper.appendChild(itemIcon);

            // Add helper text
            var itemHelper = document.createElement('div');
            itemHelper.className = 'helper-text';
            itemHelper.innerHTML = '<i class="fas fa-info-circle"></i> Enter the product or item name';
            itemTd.appendChild(itemHelper);
        }

        // Enhance Price Input
        if (priceInput) {
            priceInput.setAttribute('placeholder', 'Enter price (e.g., 50)');
            priceInput.setAttribute('type', 'number');
            priceInput.setAttribute('min', '0');
            priceInput.setAttribute('step', '0.01');

            // Wrap input
            var priceTd = priceInput.parentNode;
            var priceWrapper = document.createElement('div');
            priceWrapper.className = 'price-wrapper';
            priceInput.parentNode.insertBefore(priceWrapper, priceInput);
            priceWrapper.appendChild(priceInput);

            // Add prefix
            var pricePrefix = document.createElement('span');
            pricePrefix.className = 'price-prefix';
            pricePrefix.innerHTML = '₹';
            priceWrapper.appendChild(pricePrefix);

            // Add quick price buttons
            var quickPrices = document.createElement('div');
            quickPrices.className = 'quick-prices';
            quickPrices.innerHTML = `
                <button type="button" class="quick-price-btn" data-price="25">₹25</button>
                <button type="button" class="quick-price-btn" data-price="50">₹50</button>
                <button type="button" class="quick-price-btn" data-price="100">₹100</button>
                <button type="button" class="quick-price-btn" data-price="200">₹200</button>
                <button type="button" class="quick-price-btn" data-price="500">₹500</button>
            `;
            priceTd.appendChild(quickPrices);

            // Add helper text
            var priceHelper = document.createElement('div');
            priceHelper.className = 'helper-text';
            priceHelper.innerHTML = '<i class="fas fa-info-circle"></i> Enter price per unit in rupees';
            priceTd.appendChild(priceHelper);
        }

        // Enhance Submit Button
        if (submitBtn) {
            submitBtn.value = 'Add Price';
        }
    }

    // Bind Events
    function bindEvents() {
        // Quick price buttons
        document.querySelectorAll('.quick-price-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                priceInput.value = this.getAttribute('data-price');
                priceInput.focus();
                validateInput(priceInput);
            });
        });

        // Input validation
        itemInput.addEventListener('input', function() {
            validateInput(this);
        });

        priceInput.addEventListener('input', function() {
            validateInput(this);
        });

        // Form submission
        form.addEventListener('submit', function(e) {
            var isValid = true;

            if (!itemInput.value.trim()) {
                itemInput.classList.add('input-invalid');
                isValid = false;
            }

            if (!priceInput.value.trim() || isNaN(priceInput.value)) {
                priceInput.classList.add('input-invalid');
                isValid = false;
            }

            if (!isValid) {
                e.preventDefault();
                showToast('error', 'Error!', 'Please fill all fields correctly');

                setTimeout(function() {
                    itemInput.classList.remove('input-invalid');
                    priceInput.classList.remove('input-invalid');
                }, 1500);
                return;
            }

            // Show loading state
            submitBtn.value = 'Adding...';
            submitBtn.classList.add('btn-loading');

            // For demo - uncomment to test
            /*
            e.preventDefault();
            setTimeout(function() {
                showToast('success', 'Success!', 'Price added successfully');
                submitBtn.value = 'Add Price';
                submitBtn.classList.remove('btn-loading');
                form.reset();
            }, 1500);
            */
        });

        // Input focus effects
        itemInput.addEventListener('focus', function() {
            this.closest('tr').style.background = 'linear-gradient(135deg, #F1F8E9 0%, #E8F5E9 100%)';
        });

        itemInput.addEventListener('blur', function() {
            this.closest('tr').style.background = '';
        });

        priceInput.addEventListener('focus', function() {
            this.closest('tr').style.background = 'linear-gradient(135deg, #F1F8E9 0%, #E8F5E9 100%)';
        });

        priceInput.addEventListener('blur', function() {
            this.closest('tr').style.background = '';
        });
    }

    // Validate Input
    function validateInput(input) {
        input.classList.remove('input-invalid', 'input-valid');

        if (input.value.trim()) {
            if (input === priceInput) {
                if (!isNaN(input.value) && parseFloat(input.value) > 0) {
                    input.classList.add('input-valid');
                } else {
                    input.classList.add('input-invalid');
                }
            } else {
                input.classList.add('input-valid');
            }
        }
    }

    // Show Toast
    function showToast(type, title, message) {
        toast.className = 'toast ' + type;
        toast.querySelector('.toast-icon i').className = type === 'success' ? 'fas fa-check' : 'fas fa-exclamation';
        toast.querySelector('.toast-text h4').textContent = title;
        toast.querySelector('.toast-text p').textContent = message;
        toast.classList.add('show');

        setTimeout(function() {
            toast.classList.remove('show');
        }, 4000);
    }

    // Global
    window.showPriceToast = showToast;

    // Run
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

</body>
</html>
