<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', Arial, sans-serif;
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #E8F5E9;
    }

    #form1 {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 650px;
        overflow: hidden;
    }

    table {
        width: 100% !important;
        height: auto !important;
        border: none !important;
        border-collapse: collapse;
    }

    tr, th, td {
        border: none !important;
    }

    /* Header Row */
    tr:first-child th {
        background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%) !important;
        padding: 40px 30px !important;
        text-align: center !important;
        color: #ffffff !important;
        font-size: 26px !important;
        font-weight: 700 !important;
    }

    /* Form Row */
    tr:nth-child(2) {
        background: #ffffff;
    }

    tr:nth-child(2):hover {
        background: #F1F8E9;
    }

    /* Label Cell */
    tr:nth-child(2) th[scope="row"] {
        background: transparent !important;
        color: #1B5E20 !important;
        font-size: 16px !important;
        font-weight: 600 !important;
        text-align: left !important;
        padding: 30px 15px 30px 30px !important;
        width: 120px !important;
        vertical-align: top !important;
    }

    /* Textarea Cell */
    tr:nth-child(2) td {
        padding: 25px 30px 25px 10px !important;
        vertical-align: middle !important;
    }

    tr:nth-child(2) td label {
        display: none !important;
    }

    /* Textarea */
    textarea {
        width: 100% !important;
        padding: 16px 18px !important;
        font-size: 15px !important;
        font-weight: 500 !important;
        font-family: 'Inter', Arial, sans-serif !important;
        color: #1B5E20 !important;
        background: #FAFAFA !important;
        border: 2px solid #C8E6C9 !important;
        border-radius: 12px !important;
        outline: none !important;
        transition: all 0.3s ease !important;
        resize: vertical !important;
        min-height: 180px !important;
        line-height: 1.6 !important;
    }

    textarea::placeholder {
        color: #81C784 !important;
        font-weight: 400 !important;
    }

    textarea:focus {
        border-color: #4CAF50 !important;
        background: #ffffff !important;
        box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.15) !important;
    }

    /* Submit Button Row */
    tr:last-child th {
        background: #F5F5F5 !important;
        padding: 30px !important;
        text-align: center !important;
        border-top: 2px solid #E8F5E9 !important;
    }

    /* Submit Button */
    input[type="submit"],
    input#button {
        background: linear-gradient(135deg, #43A047 0%, #2E7D32 100%) !important;
        color: #ffffff !important;
        border: none !important;
        padding: 16px 50px !important;
        font-size: 16px !important;
        font-weight: 700 !important;
        font-family: 'Inter', Arial, sans-serif !important;
        border-radius: 12px !important;
        cursor: pointer !important;
        text-transform: uppercase !important;
        letter-spacing: 1.5px !important;
        box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3) !important;
        transition: all 0.3s ease !important;
    }

    input[type="submit"]:hover,
    input#button:hover {
        background: linear-gradient(135deg, #388E3C 0%, #1B5E20 100%) !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4) !important;
    }

    /* Character Counter */
    .char-counter {
        text-align: right;
        font-size: 12px;
        color: #81C784;
        margin-top: 8px;
        font-weight: 500;
    }

    .char-counter.warning {
        color: #FF9800;
    }

    .char-counter.limit {
        color: #f44336;
    }

    /* Last Updated Info */
    .last-updated {
        font-size: 12px;
        color: #81C784;
        margin-top: 10px;
        text-align: left;
    }

    /* Responsive */
    @media (max-width: 600px) {
        body {
            padding: 20px 15px;
        }

        #form1 {
            border-radius: 15px;
        }

        tr:first-child th {
            padding: 30px 20px !important;
            font-size: 22px !important;
        }

        tr:nth-child(2) th[scope="row"] {
            display: block !important;
            width: 100% !important;
            padding: 20px 20px 10px 20px !important;
            text-align: left !important;
        }

        tr:nth-child(2) td {
            display: block !important;
            padding: 0 20px 20px 20px !important;
        }

        input[type="submit"],
        input#button {
            width: 100% !important;
            padding: 16px 40px !important;
        }
    }
</style>
</head>

<body>
<form id="form1" name="form1" method="post" action="/exp_edit_news_post/{{ id }}">
  <table width="814" height="285" border="1">
    <tr>
      <th colspan="2" scope="row">Edit News</th>
    </tr>
    <tr>
      <th width="160" scope="row">News</th>
      <td width="638"><label for="textarea"></label>
      <textarea name="textarea" id="textarea" cols="45" rows="5">{{ data.news }}</textarea></td>
    </tr>
    <tr>
      <th height="86" colspan="2" scope="row"><input type="submit" name="button" id="button" value="Edit" /></th>
    </tr>
  </table>
</form>

<script>
(function() {
    // Add icon to header
    var header = document.querySelector('tr:first-child th');
    if (header) {
        header.innerHTML = '<i class="fas fa-newspaper" style="margin-right: 12px;"></i>' + header.innerHTML;
    }

    // Add icon to label
    var labelCell = document.querySelector('tr:nth-child(2) th[scope="row"]');
    if (labelCell) {
        labelCell.innerHTML = '<i class="fas fa-edit" style="margin-right: 10px; color: #43A047;"></i>' + labelCell.innerHTML;
    }

    // Add enhancements to textarea
    var textarea = document.getElementById('textarea');
    if (textarea) {
        // Add placeholder if empty
        if (!textarea.value || textarea.value.indexOf('{{') !== -1) {
            textarea.placeholder = 'Enter your news content here...';
        }

        // Create wrapper for textarea
        var wrapper = document.createElement('div');
        wrapper.className = 'textarea-wrapper';
        textarea.parentNode.insertBefore(wrapper, textarea);
        wrapper.appendChild(textarea);

        // Add character counter
        var counter = document.createElement('div');
        counter.className = 'char-counter';
        var initialLength = textarea.value.indexOf('{{') === -1 ? textarea.value.length : 0;
        counter.innerHTML = '<i class="fas fa-text-width" style="margin-right: 5px;"></i>' + initialLength + ' / 1000 characters';
        wrapper.appendChild(counter);

        // Update counter on input
        textarea.addEventListener('input', function() {
            var length = textarea.value.length;
            counter.innerHTML = '<i class="fas fa-text-width" style="margin-right: 5px;"></i>' + length + ' / 1000 characters';

            counter.className = 'char-counter';
            if (length > 800) {
                counter.classList.add('warning');
            }
            if (length > 1000) {
                counter.classList.add('limit');
            }
        });

        // Add last updated info
        var lastUpdated = document.createElement('div');
        lastUpdated.className = 'last-updated';
        lastUpdated.innerHTML = '<i class="fas fa-clock" style="margin-right: 5px;"></i>Last updated: ' + new Date().toLocaleDateString();
        wrapper.appendChild(lastUpdated);
    }

    // Update submit button text
    var submitBtn = document.getElementById('button');
    if (submitBtn) {
        submitBtn.value = 'Update News';
    }

})();
</script>

</body>
</html>
